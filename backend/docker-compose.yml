services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tallerai:tallerai@db:5432/tallerai
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tallerai
      POSTGRES_USER: tallerai
      POSTGRES_PASSWORD: tallerai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallerai -d tallerai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
